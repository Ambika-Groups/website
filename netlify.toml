# Netlify: plain static site from the Next.js export in out/. See DEPLOY.md.
# `npm run build` runs prebuild (photo pipeline) and postbuild (prefetch fix + out/_redirects).
#
# Headers and redirects live in files inside the published folder, so they also work with Netlify Drop
# (which uploads out/ only and never reads this file):
#   public/_headers           -> out/_headers    security headers + cache rules
#   scripts/netlify-redirects -> out/_redirects  /page.html -> /page (301)

[build]
  # Repository root = this Website folder (it is its own repo). If it ever sits inside a bigger repo,
  # set Netlify's "Base directory" to the folder that contains this file.
  command = "npm run build"
  publish = "out"

[build.environment]
  # Same Node as development (.nvmrc); change both together.
  NODE_VERSION = "24.11.1"
  # Netlify auto-installs its Next.js adapter (@netlify/plugin-nextjs) for Next sites. This is a
  # static export, so turn the adapter off entirely: no functions, no adapter headers or routing;
  # out/ is published as-is.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  # Netlify's secrets scanner fails a build when it finds a scanned variable's value in the built files. These
  # NEXT_PUBLIC_ values are embedded in the site on purpose (they are public by design), so tell the scanner to skip
  # them. Comma-separated key names (Netlify "Secrets Controller" docs). Real secrets must never be added here.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_WEB3FORMS_KEY,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_ENQUIRY_ENDPOINT,NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_TURNSTILE_SITE_KEY"

# Clean URLs: Netlify serves /contact from out/contact.html. Unknown URLs get out/404.html with
# status 404 automatically.

# ── Strict launch mode: an unfinished site cannot be published ─────────────────────────────────────────────────────
# Production (the main branch) runs `npm run launch-check` after the build and FAILS the deploy while a must-have
# answer is missing or a placeholder shows (LAUNCH-QUESTIONS.md). Until the real site address (Q1) is set, a production
# deploy is therefore blocked on purpose.
[context.production.environment]
  LAUNCH_STRICT = "1"

# ── Preview path: see the site on a .netlify.app address without strict mode ───────────────────────────────────────
# Any other branch (branch deploy) and any pull request (deploy preview) builds non-strict, with the page addresses set
# to that deploy's own address, so links, the sitemap and canonical tags are right while you look around.
# From this computer: `npm run deploy:preview`.
[context.deploy-preview]
  command = "NEXT_PUBLIC_SITE_URL=$DEPLOY_PRIME_URL npm run build"
[context.deploy-preview.environment]
  LAUNCH_STRICT = "0"

[context.branch-deploy]
  command = "NEXT_PUBLIC_SITE_URL=$DEPLOY_PRIME_URL npm run build"
[context.branch-deploy.environment]
  LAUNCH_STRICT = "0"
